# Retention Copilot — Global Configuration
project:
  name: "Retention Copilot"
  version: "1.0.0"
  random_seed: 42
  prediction_cutoff_date: "2026-06-30"
  observation_window_days: 90
  outcome_window_days: 60

data_generation:
  n_customers: 20000
  random_seed: 42
  prediction_cutoff_date: "2026-06-30"
  contract_types:
    month_to_month: 0.55
    one_year: 0.28
    two_year: 0.17
  plan_tiers:
    Basic:
      monthly_base_fee: 29.0
      gross_margin_pct: 0.72
      expected_post_retention_months: 8.0
    Standard:
      monthly_base_fee: 69.0
      gross_margin_pct: 0.78
      expected_post_retention_months: 10.0
    Enterprise:
      monthly_base_fee: 199.0
      gross_margin_pct: 0.84
      expected_post_retention_months: 14.0
  campaigns:
    none:
      cost: 0.0
      treatment_prob: 0.34
      label: "Control (No Intervention)"
    discount_15pct:
      cost: 28.0
      treatment_prob: 0.22
      label: "15% Promotional Discount (3 Months)"
    priority_support:
      cost: 45.0
      treatment_prob: 0.22
      label: "Dedicated Priority Support & Onboarding"
    executive_bundle:
      cost: 85.0
      treatment_prob: 0.22
      label: "Executive Account Review + Custom Credit"

etl:
  spark_app_name: "RetentionCopilotETL"
  spark_master: "local[*]"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  raw_dir: "data/raw"
  processed_dir: "data/processed"

models:
  churn:
    logistic_regression:
      C: 1.0
      max_iter: 300
    xgboost:
      n_estimators: 60
      max_depth: 4
      learning_rate: 0.12
      subsample: 0.85
      min_samples_leaf: 25
  nlp:
    model_name: "all-MiniLM-L6-v2"
    embedding_dim: 24
    n_clusters: 5
    random_seed: 42
  uplift:
    meta_learner: "T-Learner"
    base_estimator: "gradient_boosting"
    n_estimators: 45
    max_depth: 4
    learning_rate: 0.10

financial_engine:
  default_budget: 75000.0
  min_churn_risk_threshold: 0.15
  min_uplift_threshold: 0.01
  min_expected_profit: 5.0
  discount_rate_annual: 0.10
  intervention_catalog:
    discount_15pct:
      name: "15% Promotional Discount (3 Months)"
      cost: 28.0
      effect_multiplier: 0.85
    priority_support:
      name: "Dedicated Priority Support & Onboarding"
      cost: 45.0
      effect_multiplier: 1.00
    executive_bundle:
      name: "Executive Account Review + Custom Credit"
      cost: 85.0
      effect_multiplier: 1.25

snowflake:
  account_env: "SNOWFLAKE_ACCOUNT"
  user_env: "SNOWFLAKE_USER"
  password_env: "SNOWFLAKE_PASSWORD"
  role_env: "SNOWFLAKE_ROLE"
  warehouse: "RETENTION_WH"
  database: "RETENTION_COPILOT_DB"
  schema: "ANALYTICS"
  local_sqlite_fallback: "data/warehouse/retention_warehouse.db"

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 600
  api_key_env: "OPENAI_API_KEY"
  strict_validation: true
